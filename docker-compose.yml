services:

  postgres:
    image: postgres:16-alpine
    container_name: portal-jubilados-postgres
    environment:
      POSTGRES_DB: strapi_db
      POSTGRES_USER: strapi_user
      POSTGRES_PASSWORD: strapi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi_user -d strapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal-network
    restart: unless-stopped

  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-jubilados-strapi
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_db
      DATABASE_USERNAME: strapi_user
      DATABASE_PASSWORD: strapi_password
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: development
      APP_KEYS: "key1,key2,key3,key4"
      API_TOKEN_SALT: "api_token_salt_123"
      ADMIN_JWT_SECRET: "admin_jwt_secret_123"
      TRANSFER_TOKEN_SALT: "transfer_token_salt_123"
      JWT_SECRET: "jwt_secret_123"
    ports:
      - "1337:1337"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "test -d /app || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal-jubilados-frontend
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      STRAPI_API_URL: http://strapi:1337
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - portal-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: portal-jubilados-nginx
    depends_on:
      strapi:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - portal-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  portal-network:
    driver: bridge